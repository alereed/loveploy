name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
      # With a signing certificate in the repo's secrets, every build has the same identity,
      # so macOS keeps the permissions (microphone, Keychain, Accessibility, notifications)
      # between updates. Without it the build is signed ad hoc, as before.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.BP_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.BP_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "Sin certificado: firma ad hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          # By fingerprint: a self-signed certificate isn't "valid" for find-identity -v.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/[0-9A-F]{40}/ {print $2; exit}')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build Blender Play.app
        run: scripts/build-app.sh
      # On this real Mac: load pages and a terminal with helper processes, pause them, and
      # check their processes are gone and their memory was returned.
      - name: Memory self-test
        run: '"dist/Blender Play.app/Contents/MacOS/Loveploy" --selftest-memory'
      # Saves, reads back and deletes an encrypted copy in the cloud with a throwaway code.
      - name: Cloud self-test
        run: '"dist/Blender Play.app/Contents/MacOS/Loveploy" --selftest-cloud'
      # The download: a .dmg (open it, drag Blender Play to Applications).
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderPlay
          path: dist/BlenderPlay.dmg
      # The zip, for the Intel test below.
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderPlay-zip
          path: dist/BlenderPlay.zip

  # The same app you download, on an Intel Mac with macOS 15 (like an iMac 2013 with OpenCore):
  # it must carry the Intel code, open and stay open, and pass the memory self-test.
  intel:
    needs: macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BlenderPlay
      - name: Unpack
        run: |
          # The same disk image you download: mount it and copy the app out.
          hdiutil attach BlenderPlay.dmg -mountpoint /tmp/bp -nobrowse -quiet
          ls /tmp/bp
          cp -R "/tmp/bp/Blender Play.app" .
          hdiutil detach /tmp/bp -quiet
          uname -m
          sw_vers
          BIN="Blender Play.app/Contents/MacOS/Loveploy"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64
          otool -l -arch x86_64 "$BIN" | grep -A3 LC_BUILD_VERSION | grep minos
      - name: Opens and stays open
        run: |
          rm -rf ~/Library/Logs/DiagnosticReports/Loveploy* 2>/dev/null || true
          "Blender Play.app/Contents/MacOS/Loveploy" > app.log 2>&1 &
          PID=$!
          sleep 30
          if kill -0 $PID 2>/dev/null; then echo "Sigue abierta tras 30 s (pid $PID)"; else echo "Se cerró"; cat app.log; exit 1; fi
          ps -o pid,rss,command -p $PID
          kill $PID
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i loveploy && exit 1 || echo "Sin reportes de fallo"
      - name: Memory self-test on Intel
        run: '"Blender Play.app/Contents/MacOS/Loveploy" --selftest-memory'
